
name = "community-platform-os-worker"
main = "src/index.ts"
compatibility_date = "2026-08-31"

[[d1_databases]]
binding = "DB"
database_name = "community_platform_os"
database_id = "0c84245f-34c2-448b-9385-0370d617113b"

[[kv_namespaces]]
binding = "PLATFORM_CACHE"
id = "community-platform-os-cache"

[[queues.producers]]
binding = "EVENT_QUEUE"
queue = "community-platform-os-events"

[[queues.consumers]]
queue = "community-platform-os-events"
max_batch_size = 10
max_batch_timeout = 5
